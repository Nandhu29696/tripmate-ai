name: CI

on:
  push:
    branches: [main, tripmate-ai-publish, tripmate-hardening]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check frontend script syntax
        run: node --check static/script.js

      - name: Unit and API tests (no network, no database)
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image (also verifies the pinned AviationStack MCP install)
        run: docker build -t tripmate-ai:ci .

      - name: Smoke-test the pinned tools inside the image
        run: |
          docker run --rm --entrypoint sh tripmate-ai:ci -c \
            'command -v aviationstack-mcp && python -c "import app" 2>&1 | tail -1'
