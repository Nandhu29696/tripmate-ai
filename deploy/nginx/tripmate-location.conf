# Include these locations inside the existing TLS server {} block.
# The app enforces sign-in, per-user quotas, throttling and security headers
# (CSP, HSTS, X-Frame-Options, ...). Nginx adds coarse per-IP rate limits.

client_max_body_size 64k;

# Interactive API docs and the DB-probing readiness endpoint are internal only.
location ~ ^/(docs|redoc|openapi\.json)$ {
    return 404;
}

location = /ready {
    return 404;
}

# Expensive endpoints (each plan makes several LLM and tool calls): 5 requests/minute
# per IP, burst of 2. This covers the JSON and the streaming variants.
# Precedence note: the generic /api/ location below must NOT use ^~, otherwise it
# wins over this regex location and silently bypasses the strict limit.
location ~ ^/api/travel(/approve)?(/stream)?$ {
    limit_req zone=tripmate_api burst=2 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8014;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Streaming progress (NDJSON) must reach the browser immediately.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Password sign-in / sign-up / forgot / reset: 10 requests/minute per IP, burst 5.
# (The app also throttles per account; this stops floods before they reach it.)
location ~ ^/api/auth/(register|login|forgot|reset)$ {
    limit_req zone=tripmate_auth burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8014;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

# Google sign-in redirect/callback and the email-confirmation link.
location /auth/ {
    limit_req zone=tripmate_light burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8014;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

# Everything else under /api/: 60 requests/minute per IP, burst of 20.
location /api/ {
    limit_req zone=tripmate_light burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8014;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

location / {
    proxy_pass http://127.0.0.1:8014;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
