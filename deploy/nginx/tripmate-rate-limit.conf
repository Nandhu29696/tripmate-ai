# Include inside the Nginx http {} block.
# Expensive endpoints (each plan makes several LLM and tool calls): strict.
limit_req_zone $binary_remote_addr zone=tripmate_api:10m rate=5r/m;
# Cheap endpoints (session, trip list/restore/delete): generous, so a page
# reload (3-4 requests) never trips the limit.
limit_req_zone $binary_remote_addr zone=tripmate_light:10m rate=60r/m;
# Password sign-in, sign-up, forgot and reset: brute-force and mail-bombing protection.
limit_req_zone $binary_remote_addr zone=tripmate_auth:10m rate=10r/m;
